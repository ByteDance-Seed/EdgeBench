schema_version = 0
id = "grid_turing_robot"
name = "Grid Turing Robot"
category = "Combinatorial Optimization"
language = "Python"
description = "Design transition rules and initial coloring for a Turing-like robot on a colored grid to maximize the number of distinct cells visited while minimizing the rule set size."
version = "1.0.0"
status = "migrated"

[environment]
base = "python310"
platform = "linux/amd64"
cwd = "/home/workspace/grid_turing_robot"
internet = false
cpus = 4
memory = "16g"
# Official leaderboard limits (v1 kept them only in the experiment YAMLs).

[submission]
paths = ["solution.py"]
exclude = []

[judge]
cmd = "python3 /judge/grade.py"
timeout_sec = 600
cpus = 4
memory = "8g"
# v1 eval_timeout = 600. Official leaderboard limits (v1 kept them only in the experiment YAMLs).
# eval_grid_turing_robot.py runs the 50 cases 8 at a time, each `python3 solution.py` under a
# 30 s wall-clock timeout. Scores of time-limited solutions depend on host CPU speed; see NOTES.md.

[score]
direction = "minimize"
rescale = { kind = "piecewise_min", baseline = 9025986.0, rank30 = 4490.0, rank1 = 1575.0, super_anchor = 554.75 }
