schema_version = 0
id = "integer_compression_codec"
name = "Integer Compression Codec"
category = "Systems & Software Engineering"
language = "C++"
description = "Improve a C++ integer compression codec for better compression ratio and decode throughput on uint32 datasets via techniques such as delta encoding, bit-packing, and SIMD vectorization. Exact round-trip correctness is mandatory."
version = "1.0.0"
status = "migrated"

[environment]
base = "cpp"
platform = "linux/amd64"
cwd = "/home/workspace/integer-compression-codec"
internet = false
cpus = 4
memory = "16g"
# Official leaderboard limits (v1 kept them only in the experiment YAMLs).

[submission]
paths = ["include/", "src/", "Makefile"]
exclude = ["**/__pycache__/", "outputs/", "data/", ".judge-bin/"]

[judge]
cmd = "bash /judge/run.sh"
timeout_sec = 2400
cpus = 4
memory = "8g"
# Official leaderboard limits (v1 kept them only in the experiment YAMLs).
# The score multiplies a measured decode throughput (GB/s), so it depends on host CPU and load;
# see NOTES.md.

[score]
direction = "maximize"
rescale = { kind = "linear", lower = 0.0, upper = 100.0 }
