schema_version = 0
id = "openrct2_theme_park_ai"
name = "Openrct2 Theme Park Ai"
category = "Interactive Games & Simulators"
language = "Python"
description = "Write a JavaScript plugin for OpenRCT2 that autonomously builds rides, hires staff, sets pricing, and grows park company value across multiple scenarios of increasing complexity."
version = "1.0.0"
status = "migrated"

[environment]
base = "python310"
platform = "linux/amd64"
cwd = "/home/workspace/openrct2"
internet = false
cpus = 4
memory = "16g"
# Official leaderboard limits (v1 kept them only in the experiment YAMLs).

[submission]
paths = ["my_plugin.js"]
exclude = []

[judge]
cmd = "python3 /judge/grade.py"
timeout_sec = 2400
cpus = 4
memory = "8g"
# Official leaderboard limits (v1 kept them only in the experiment YAMLs).
# Each of the 3 scenarios runs OpenRCT2 headless for at most 120 s wall clock, so scores depend on
# host speed; see NOTES.md.

[score]
direction = "maximize"
rescale = { kind = "linear", lower = 0.0, upper = 40000.0 }
