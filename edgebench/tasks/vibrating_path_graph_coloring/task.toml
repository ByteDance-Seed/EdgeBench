schema_version = 0
id = "vibrating_path_graph_coloring"
name = "Vibrating Path Graph Coloring"
category = "Combinatorial Optimization"
language = "Python"
description = "Color graph vertices and selectively remove edges to minimize a cost that penalizes both removed edges and monochromatic surviving edges."
version = "1.0.0"
status = "migrated"

[environment]
base = "python310"
platform = "linux/amd64"
cwd = "/home/workspace/vibrating_path"
internet = false
cpus = 4
memory = "16g"
# Official leaderboard limits (v1 kept them only in the experiment YAMLs).

[submission]
paths = ["solution.py"]
exclude = []

[judge]
cmd = "python3 /judge/grade.py"
timeout_sec = 600
cpus = 4
memory = "8g"
# Official leaderboard limits (v1 kept them only in the experiment YAMLs).
# eval_vibrating_path.py runs the 50 cases 8 at a time, each `python3 solution.py` under a 30 s
# wall-clock timeout (tester 60 s). Scores of time-limited (anytime) solutions depend on host CPU
# speed and load; see NOTES.md.

[score]
direction = "minimize"
rescale = { kind = "piecewise_log_min", baseline = 31051708.0, rank30 = 3288665.0, rank1 = 2181554.0, super_anchor = 1904776.25 }
