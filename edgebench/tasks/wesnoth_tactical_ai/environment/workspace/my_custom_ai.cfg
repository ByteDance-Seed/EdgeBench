[ai]
  id=my_custom_ai
  description="SE-Bench baseline AI (uses default combat + recruit)"
  [stage]
    id=main_loop
    name=ai_default_rca::candidate_action_evaluation_loop
    [candidate_action]
      id=recruit
      engine=cpp
      name=ai_default_rca::aspect_recruitment_phase
      max_score=300000
      score=300000
    [/candidate_action]
    [candidate_action]
      id=combat
      engine=cpp
      name=ai_default_rca::combat_phase
      max_score=100000
      score=100000
    [/candidate_action]
    [candidate_action]
      id=movement
      engine=cpp
      name=ai_default_rca::move_leader_to_goals_phase
      max_score=90000
      score=90000
    [/candidate_action]
    [candidate_action]
      id=get_villages
      engine=cpp
      name=ai_default_rca::get_villages_phase
      max_score=60000
      score=60000
    [/candidate_action]
  [/stage]
[/ai]
