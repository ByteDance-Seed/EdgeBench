schema_version = 0
id = "sphere_eversion_formalization"
name = "Sphere Eversion Formalization"
category = "Formal Math & Theorem Proving"
language = "Lean 4"
description = "Complete proof obligations in a Lean 4 formalization of sphere eversion, spanning smooth immersions, jet bundles, ample differential relations, and convex integration."
version = "1.0.0"
status = "migrated"

[environment]
base = "lean-4.28.0-mathlib-8f9d9cf"
platform = "linux/amd64"
cwd = "/home/workspace/"
internet = false
cpus = 8
memory = "16g"

[submission]
paths = ["se-bmk-intern/sphere-eversion"]
exclude = ["se-bmk-intern/sphere-eversion/.lake"]

[judge]
cmd = "bash /judge/run.sh"
timeout_sec = 2400
cpus = 8
memory = "16g"

[score]
direction = "maximize"
# raw score = repaired / 661 baseline sorry declarations, 0 if the Gromov HASH check fails (v1 eval_lean `score`)
rescale = { kind = "linear", lower = 0.0, upper = 1.0 }
