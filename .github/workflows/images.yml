name: Task Images

# Builds every EdgeBench image whose content-hash tag is not yet in the registry.
# On main the images are pushed to docker.io/seededge/edgebench.<role>.<name>
# (one repository per image, like v1); on pull requests changed tasks are only
# built. Pushing needs the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets; nothing
# else logs in, and the registry checks are HEAD requests that Docker Hub does
# not count against its pull rate limit.

on:
  push:
    branches: [main]
    paths: ['edgebench/**', 'tools/ci_images.py', 'sforge/harness/task_spec.py', 'sforge/harness/docker_build.py']
  pull_request:
    paths: ['edgebench/**', 'tools/ci_images.py', 'sforge/harness/task_spec.py', 'sforge/harness/docker_build.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      bases: ${{ steps.plan.outputs.bases }}
      tasks: ${{ steps.plan.outputs.tasks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - id: plan
        run: python tools/ci_images.py plan | tee -a "$GITHUB_OUTPUT"

  # Shared bases are built once and pushed before the tasks that use them.
  # Pull requests skip this; each task job then builds its own base.
  bases:
    needs: plan
    if: needs.plan.outputs.bases != '[]' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: ${{ fromJSON(needs.plan.outputs.bases) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: python tools/ci_images.py base "${{ matrix.base }}"

  tasks:
    needs: [plan, bases]
    if: ${{ !cancelled() && needs.plan.outputs.tasks != '[]' && needs.bases.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: python tools/ci_images.py task "${{ matrix.task }}" ${{ env.PUSH == 'true' && '--push' || '' }}
